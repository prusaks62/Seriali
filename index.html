<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top Series</title>
    <meta name="description" content="21 TV series worth watching, ranked by rating. Search, filter by genre, save favorites and watch trailers.">
    <link rel="icon" type="image/webp" href="icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Apply the saved light/dark choice before the page is drawn, so it doesn't flash
        try { var savedTheme = localStorage.getItem('theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme; } catch (e) {}
    </script>
</head>
<body>
    <header class="site-header wrap">
        <a class="logo" href="./">Top Series</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light mode">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
        </button>
    </header>

    <main>
        <!-- "What to watch tonight": a TV that shows a random series -->
        <section class="tonight wrap" aria-labelledby="tonight-title">
            <div class="tv">
                <div class="tv-bezel">
                    <div class="tv-screen" id="tv-screen">
                        <div class="poster tv-poster" id="tv-poster"><img alt=""></div>
                        <span class="tv-channel" id="tv-channel" aria-hidden="true"></span>
                        <div class="tv-static" aria-hidden="true"></div>
                    </div>
                    <div class="tv-panel" aria-hidden="true">
                        <span class="tv-grille"></span>
                        <span class="knob"></span>
                        <span class="knob"></span>
                    </div>
                </div>
                <div class="tv-stand" aria-hidden="true"></div>
            </div>

            <div class="tonight-info">
                <h1 id="tonight-title">Not sure what to watch tonight?</h1>
                <p class="lead">Change the channel until something looks good. It only picks from the series that match your filters below.</p>
                <div class="pick" aria-live="polite">
                    <h2 class="pick-title" id="pick-title"></h2>
                    <p class="pick-meta" id="pick-meta"></p>
                    <p class="pick-text" id="pick-text"></p>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" id="change-channel" type="button">Change channel</button>
                    <button class="btn btn-ghost" id="pick-details" type="button">See details</button>
                </div>
            </div>
        </section>

        <!-- Catalog with search, sorting, genre filter and favorites -->
        <section class="browse wrap" aria-labelledby="browse-title">
            <div class="browse-head">
                <h2 id="browse-title">All series</h2>
                <p class="result-count" id="result-count" aria-live="polite"></p>
            </div>

            <div class="controls">
                <input class="field search" type="search" id="search" placeholder="Search by title or story" aria-label="Search series">
                <select class="field" id="sort" aria-label="Sort series">
                    <option value="rating">Top rated</option>
                    <option value="title">Title A–Z</option>
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>
                <button class="field fav-filter" id="fav-filter" type="button" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z"/></svg>
                    Favorites <span class="fav-count" id="fav-count">0</span>
                </button>
            </div>

            <div class="genres" id="genres" role="group" aria-label="Filter by genre"></div>

            <ul class="grid" id="grid"></ul>

            <div class="empty" id="empty" hidden>
                <p id="empty-text"></p>
                <button class="btn btn-ghost" id="clear-filters" type="button">Show all series</button>
            </div>
        </section>
    </main>

    <footer class="site-footer wrap">
        <p>Ratings are IMDb scores from when the list was made. Trailers play from YouTube.</p>
        <p>© <span id="year">2026</span> Patriks</p>
    </footer>

    <!-- Details window, filled in by js/app.js -->
    <dialog class="details" id="details" aria-labelledby="details-title"></dialog>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
